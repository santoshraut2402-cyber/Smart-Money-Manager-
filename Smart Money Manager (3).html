<style>
:root{--bg:#F4F7FA;--card:#fff;--tx:#0B2545;--mut:#6B7A90;--ln:#E3E9F0;--navy:#0B2545;--g:#12B76A;--r:#E5484D;--a:#F5A524;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081426;--card:#10233F;--tx:#E8EEF7;--mut:#8EA0B8;--ln:#1E3454;--navy:#16335C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081426;--card:#10233F;--tx:#E8EEF7;--mut:#8EA0B8;--ln:#1E3454;--navy:#16335C;color-scheme:dark}
*{box-sizing:border-box}html{background:#0A2A12;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:520px;color:var(--tx);font:500 15px/1.4 'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;padding:18px 16px 100px}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:17px;margin:18px 0 10px;font-weight:700}h3{margin:0 0 12px}
small,.mut{color:var(--mut);font-size:12px}a{color:var(--g);font-weight:700;cursor:pointer;font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:0 0 14px}
.hero{background:var(--navy);color:#fff;border:0;border-radius:26px;padding:22px}.hero small{color:#B6C4D9}.hero b{display:block;font-size:34px;font-weight:800;margin:2px 0 10px}
.hero .sp small{display:block}.hero .sp b{font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tile{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}.tile span{display:block;color:var(--mut);font-size:12px}.tile b{font-size:16px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}.row>div{flex:1;min-width:0}.row small{display:block}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g)}.dot.expense{background:var(--r)}.pos{color:var(--g)}.neg{color:var(--r)}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.seg button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:12px;font:inherit;font-size:13px;text-transform:capitalize}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}label{font-size:12px;color:var(--mut);display:block}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:700;margin-top:6px}.btn.ghost{background:transparent;color:var(--r);border:1px solid var(--ln)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}nav button.on{color:var(--g)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .fab{flex:0 0 52px;height:52px;border-radius:50%;background:var(--g);color:#fff;margin-top:-26px;justify-content:center;box-shadow:0 6px 16px rgba(18,183,106,.4)}
.pb{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:8px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:12px;margin:7px 0}.hb div{height:8px;background:var(--ln);border-radius:8px;overflow:hidden}.hb i{display:block;height:100%}
#sheet{position:fixed;inset:0;background:rgba(5,12,24,.5);display:none;align-items:flex-end;z-index:20}#sheet.open{display:flex}
:root.lock,:root.lock body{overflow:hidden}
.sh{overscroll-behavior:contain;background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;display:none;z-index:30;max-width:90%}
.auth{padding-top:8vh}.auth .card{margin-top:22px}.auth a{display:block;text-align:center;margin-top:12px}.empty{text-align:center;color:var(--mut);padding:18px}

async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=L=='ne'?tx_(m):m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function sheet(h){$('#shin').innerHTML=h;$('#sheet').classList.add('open');document.documentElement.classList.add('lock');tr($('#shin'))}const closeS=()=>{$('#sheet').classList.remove('open');document.documentElement.classList.remove('lock')};
function ask(title,fields,fn,extra=''){cb=fn;sheet(`<h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select id="f_${f.k}" ${f.c?`onchange="${f.c}"`:''}>${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t=='number'?'step="any" inputmode="decimal"':''}>`}</label>`).join('')}<button class="btn" onclick="submitAsk()">Save</button>${extra}`)}
function submitAsk(){const v={};document.querySelectorAll('#shin [id^="f_"]').forEach(e=>v[e.id.slice(2)]=e.value.trim());cb(v)}

async function doAuth(m){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email');if(p.length<6)return toast('Password needs 6+ characters');const h=await hash(p);
 if(m=='up'){if(users[e])return toast('That email already has an account');users[e]={h,name:$('#n').value.trim()||'Friend'};st.set('u',JSON.stringify(users))}else if(!users[e]||users[e].h!=h)return toast('Email or password is incorrect');
 login(e)}
function login(e){E=e;st.set('s',e);let d=null;try{d=JSON.parse(st.get('d_'+e))}catch(x){}D=d||{cur:'USD',theme:'light',tx:[],bud:{},goals:[],loans:[]};D.pin='';D.lockEdit=false;locked=false;view='home';sub='';render()}
function forgot(){ask('Reset password',[{k:'e',l:'Account email',t:'email'},{k:'p',l:'New password',t:'password'}],async v=>{const e=v.e.toLowerCase();if(!users[e])return toast('No account with that email on this device');if(v.p.length<6)return toast('Password needs 6+ characters');users[e].h=await hash(v.p);st.set('u',JSON.stringify(users));closeS();toast('Password updated. Log in now.')})}
function logout(){st.del('s');E=D=null;auth()}
/* ---------- calc ---------- */
const inP=(d,p)=>{const n=new Date(),x=new Date(d+'T00:00');if(p=='day')return d==today();if(p=='week')return x<=n&&(n-x)/864e5<7;if(p=='month')return d.slice(0,7)==today().slice(0,7);return d.slice(0,4)==today().slice(0,4)};
const sum=(t,f=()=>true)=>D.tx.filter(x=>x.type==t&&f(x)).reduce((a,x)=>a+ +x.amount,0);
const paid=l=>l.reps.reduce((a,r)=>a+ +r.amt,0);
function T(){const inc=sum('income'),exp=sum('expense'),sav=D.goals.reduce((a,g)=>a+g.saved,0);let rec=0,pay=0,lf=0;D.loans.forEach(l=>{const o=l.amount-paid(l);if(l.kind=='Lent'){rec+=o;lf+=paid(l)-l.amount}else{pay+=o;lf+=l.amount-paid(l)}});return{inc,exp,sav,rec,pay,bal:inc-exp}}
function months(){const a=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);a.push({k:ym(d),l:d.toLocaleString(undefined,{month:'short'})})}return a}
function bars(data,colors){const mx=Math.max(1,...data.flatMap(d=>d.a)),w=300,h=110,bw=w/data.length;return`<svg viewBox="0 0 ${w} ${h+16}" width="100%">`+data.map((d,i)=>{const n=d.a.length,cw=(bw-14)/n;return d.a.map((v,j)=>`<rect x="${i*bw+7+j*cw}" y="${h-v/mx*h}" width="${cw-2}" height="${v/mx*h}" rx="3" fill="${colors[j]}"/>`).join('')+`<text x="${i*bw+bw/2}" y="${h+12}" font-size="9" text-anchor="middle" fill="var(--mut)">${d.l}</text>`}).join('')+'</svg>'}
const hbars=(m,c)=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e[0]?e[0][1]:1;return e.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><div><i style="width:${v/mx*100}%;background:${c}"></i></div><b>${fmt(v)}</b></div>`).join('')||empty('Nothing recorded for this period.')};
const empty=t=>`<div class="empty">${t}</div>`,pb=(p,c)=>`<div class="pb"><i style="width:${Math.min(100,p)}%;background:${c}"></i></div>`;
const row=x=>`<div class="row" onclick="guard(()=>txForm('${x.id}'))"><i class="dot ${x.type}"></i><div><b>${esc(x.cat)}</b><small>${x.date}${x.desc?' – '+esc(x.desc):''}</small></div><b class="${x.type=='income'?'pos':'neg'}">${x.type=='income'?'+':'−'}${fmt(x.amount)}</b></div>`;
const byCat=l=>l.reduce((m,x)=>(m[x.cat]=(m[x.cat]||0)+ +x.amount,m),{});
const sorted=()=>[...D.tx].sort((a,b)=>b.date.localeCompare(a.date));
/* ---------- transactions ---------- */
function txForm(id,type){const o=id?D.tx.find(x=>x.id==id):null,t=type||(o?o.type:'expense');const cats=t=='income'?IC:EC;
 ask(`${o?'Edit':'Add'} ${t}`,[{k:'t',l:'Type',o:['expense','income'],v:t,c:`txForm('${id||''}',this.value)`},{k:'a',l:'Amount',t:'number',v:o?o.amount:''},{k:'c',l:'Category',o:cats,v:o&&o.type==t?o.cat:cats[0]},{k:'d',l:'Date',t:'date',v:o?o.date:today()},{k:'n',l:'Description',v:o?o.desc:''}],v=>{
  const a=parseFloat(v.a);if(!(a>0))return toast('Enter an amount above 0');if(!v.d)return toast('Pick a date');
  const r={id:o?o.id:uid(),type:v.t,amount:a,cat:v.c,date:v.d,desc:v.n};if(o)Object.assign(o,r);else D.tx.push(r);save();closeS();render();if(r.type=='expense')chk(r.cat)},
  o?`<button class="btn ghost" onclick="D.tx=D.tx.filter(x=>x.id!='${id}');save();closeS();render()">Delete</button>`:'')}
function chk(c){const l=D.bud[c];if(!l)return;const p=sum('expense',x=>x.cat==c&&inP(x.date,'month'))/l*100;if(p>=100)toast(`Over budget: ${c} is at ${Math.round(p)}%`);else if(p>=80)toast(`${c} budget is at ${Math.round(p)}%`)}
/* ---------- views ---------- */
const hd=t=>`<div class="sp" style="margin-bottom:14px"><h1 style="font-size:22px;margin:0">${t}</h1><a onclick="sub='';render()">Back</a></div>`;
const views={

function newGoal(){ask('New savings goal',[{k:'n',l:'Goal name'},{k:'t',l:'Target amount',t:'number'}],v=>{if(!v.n||!(+v.t>0))return toast('Add a name and a target above 0');D.goals.push({id:uid(),name:v.n,target:+v.t,saved:0});save();closeS();render()})}
function contrib(id){ask('Add to goal',[{k:'a',l:'Amount',t:'number'}],v=>{const g=D.goals.find(x=>x.id==id),a=+v.a;if(!(a>0))return toast('Enter an amount above 0');g.saved+=a;save();closeS();render();if(g.saved>=g.target)toast('Goal reached!')})}
function loanGroups(){const m={};D.loans.forEach(l=>{const k=l.kind+'|'+l.person.trim().toLowerCase();(m[k]=m[k]||{kind:l.kind,person:l.person.trim(),items:[]}).items.push(l)});return Object.values(m)}
function addMore(i){const g=loanGroups()[i];newLoan(g.kind,g.person)}
function newLoan(k,p){ask(p?'Add more':'Add loan or debt',[{k:'k',l:'Type',o:['Borrowed','Lent'],v:k},{k:'p',l:'Person',v:p||''},{k:'a',l:'Amount',t:'number'},{k:'d',l:'Repayment date',t:'date'}],v=>{if(!v.p||!(+v.a>0))return toast('Add a person and an amount above 0');D.loans.push({id:uid(),kind:v.k,person:v.p,amount:+v.a,due:v.d,date:today(),reps:[]});save();closeS();render()})}
function repayP(i){const g=loanGroups()[i],out=g.items.reduce((a,l)=>a+l.amount-paid(l),0);ask('Add repayment',[{k:'a',l:'Amount',t:'number'},{k:'d',l:'Date',t:'date',v:today()}],v=>{let a=+v.a;if(!(a>0))return toast('Enter an amount above 0');if(a>out+1e-9)return toast('That is more than the outstanding balance');for(const l of g.items){const o=l.amount-paid(l);if(o<=1e-9)continue;const x=Math.min(a,o);l.reps.push({amt:x,date:v.d});a-=x;if(a<=1e-9)break}save();closeS();render()})}
function delP(i){guard(()=>ask('Delete this person?',[],()=>{const ids=new Set(loanGroups()[i].items.map(l=>l.id));D.loans=D.loans.filter(l=>!ids.has(l.id));save();closeS();render()}))}
function repay(id){const l=D.loans.find(x=>x.id==id);ask('Add repayment',[{k:'a',l:'Amount',t:'number'},{k:'d',l:'Date',t:'date',v:today()}],v=>{const a=+v.a;if(!(a>0))return toast('Enter an amount above 0');if(a>l.amount-paid(l))return toast('That is more than the outstanding balance');l.reps.push({amt:a,date:v.d});save();closeS();render()})}
